<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>If I ___ ___ it will ___</title>

<body>
  <main id="app">
    <form id="fill-form" autocomplete="off" novalidate>
      <div class="prompt">If I</div>
      <div class="inputs">
        <label class="vis">first word
          <input id="w1" name="w1" inputmode="text" autocapitalize="off" autocomplete="off" maxlength="32" required />
        </label>
        <label class="vis">second word
          <input id="w2" name="w2" inputmode="text" autocapitalize="off" autocomplete="off" maxlength="32" required />
        </label>
        <div class="prompt">it will</div>
        <label class="vis">third word
          <input id="w3" name="w3" inputmode="text" autocapitalize="off" autocomplete="off" maxlength="32" required />
        </label>
      </div>

      <div class="row">
        <button id="submit-btn" type="submit">Submit</button>
        <button id="clear-btn" type="button" class="muted">Clear</button>
      </div>

      <div id="status" role="status" aria-live="polite"></div>
    </form>

    <section id="ai-response" hidden>
      <div class="card">
        <div id="response-text"></div>
        <button id="try-again">Try again</button>
      </div>
    </section>
  </main>
